<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apuntes de Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ---- Tokens ---- */
  :root{
    --bg: #050403;
    --bg-raised: #0e0c09;
    --fg: #ece7dd;
    --muted: #8c8579;
    --accent: #d9a441;
    --accent-ink: #1b1305;
    --accent-dim: rgba(217,164,65,0.14);
    --line: rgba(236,231,221,0.09);
    --danger: #c1694a;
    --radius: 3px;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
  }

  *{ box-sizing: border-box; }
  html, body{ height:100%; margin:0; }
  body{
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    overflow: hidden;
  }
  button, input{ font-family: inherit; color: inherit; }
  #app{ height:100%; }

  /* ---- Home ---- */
  .home{ height:100%; overflow-y:auto; padding: 40px 48px 56px; }
  .home-header{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:20px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:22px;
  }
  .brand h1{
    font-family: var(--font-display); font-weight:500; font-size:28px;
    margin:0 0 6px; letter-spacing:-0.01em;
  }
  .brand .count{
    margin:0; font-family: var(--font-mono); font-size:11.5px;
    color: var(--muted); text-transform:uppercase; letter-spacing:.08em;
  }
  .btn-add{
    background: transparent; border:1px solid var(--accent); color: var(--accent);
    padding: 11px 20px; border-radius: var(--radius); font-weight:500; font-size:14px;
    cursor:pointer; transition: background .15s ease; white-space:nowrap;
  }
  .btn-add:hover{ background: var(--accent-dim); }
  .header-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .btn-ghost{
    background: transparent; border:1px solid var(--line); color: var(--muted);
    padding: 11px 16px; border-radius: var(--radius); font-size:13.5px;
    cursor:pointer; white-space:nowrap;
  }
  .btn-ghost:hover{ color: var(--fg); border-color: var(--fg); }

  .grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 22px 20px; margin-top:30px;
  }
  .card{ cursor:pointer; }
  .card-thumb{
    position:relative; aspect-ratio: 16/9; background: var(--bg-raised);
    border:1px solid var(--line); border-radius: var(--radius); overflow:hidden;
  }
  .card-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card-thumb-empty{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color: var(--muted); font-family: var(--font-mono); font-size:10.5px;
    letter-spacing:.1em; text-transform:uppercase; gap:8px;
  }
  .card-thumb-empty::before{
    content:""; width:0; height:0; border-style:solid;
    border-width:6px 0 6px 10px; border-color:transparent transparent transparent var(--muted);
  }
  .card-del{
    position:absolute; top:6px; right:6px; width:24px; height:24px; border-radius:50%;
    border:none; background:rgba(0,0,0,.62); color:var(--fg); font-size:16px; line-height:1;
    cursor:pointer; opacity:0; transition:opacity .15s ease;
  }
  .card:hover .card-del, .card-del:focus{ opacity:1; }
  .card-title{
    font-family: var(--font-display); font-weight:500; font-size:16.5px;
    margin: 11px 0 3px; line-height:1.3;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .card-meta{
    font-family: var(--font-mono); font-size:11.5px; color: var(--muted); margin:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .empty{
    margin-top: 72px; display:flex; flex-direction:column; align-items:flex-start; gap:16px; max-width:420px;
  }
  .empty p{ color: var(--muted); font-size:14.5px; line-height:1.6; margin:0; }
  .empty .btn-add{ padding:12px 22px; }

  /* ---- Detail ---- */
  .detail{ height:100%; display:flex; flex-direction:column; }
  .detail-header{
    flex:0 0 auto; height:58px; display:flex; align-items:center; gap:10px;
    padding: 0 10px 0 6px; border-bottom:1px solid var(--line);
  }
  .btn-back{
    background:none; border:none; color:var(--fg); font-size:20px; cursor:pointer;
    padding:6px 10px; border-radius: var(--radius); line-height:1;
  }
  .btn-back:hover{ background: var(--bg-raised); }
  .title-input{
    flex:1; min-width:0; background:transparent; border:none; border-bottom:1px solid transparent;
    color: var(--fg); font-family: var(--font-display); font-size:18.5px; padding:7px 6px;
  }
  .title-input:focus{ outline:none; border-bottom-color: var(--accent); }
  .title-input::placeholder{ color: var(--muted); font-family: var(--font-body); }
  .save-indicator{
    font-family: var(--font-mono); font-size:10.5px; color: var(--accent); opacity:0;
    transition: opacity .3s ease; text-transform:uppercase; letter-spacing:.08em; white-space:nowrap;
  }
  .save-indicator.show{ opacity:1; }
  .btn-fs, .btn-del{
    background:none; border:1px solid var(--line); color: var(--muted); font-size:12.5px;
    padding:8px 14px; border-radius: var(--radius); cursor:pointer; white-space:nowrap;
  }
  .btn-fs:hover{ color: var(--fg); border-color: var(--accent); }
  .btn-del:hover{ color: var(--danger); border-color: var(--danger); }

  .detail-body{ flex:1; display:flex; min-height:0; }
  .panel-video{
    background:#000; display:flex; align-items:center; justify-content:center;
    padding:24px; position:relative; min-width:0;
  }
  .video-wrap{ width:100%; max-width:100%; aspect-ratio:16/9; }
  .video-wrap iframe{ width:100%; height:100%; border:0; display:block; }
  #ytPlayer{ width:100%; height:100%; }

  .resizer{
    flex: 0 0 10px; cursor: col-resize; position: relative;
  }
  .resizer::after{
    content:""; position:absolute; top:0; bottom:0; left:4px; width:2px; background: var(--line);
  }
  .resizer:hover::after, .resizer.active::after{ background: var(--accent); }
  body.resizing{ cursor: col-resize; user-select: none; }
  body.resizing .video-wrap iframe{ pointer-events: none; }

  .url-form{ width:min(380px,100%); display:flex; flex-direction:column; gap:13px; }
  .url-form label{
    font-family: var(--font-mono); font-size:11px; letter-spacing:.09em; text-transform:uppercase;
    color: var(--muted);
  }
  .url-form input{
    background: var(--bg-raised); border:1px solid var(--line); color:var(--fg);
    padding:11px 13px; border-radius: var(--radius); font-size:14px;
  }
  .url-form input:focus{ outline:none; border-color: var(--accent); }
  .url-form button{
    background: var(--accent); color: var(--accent-ink); border:none; font-weight:600;
    padding:11px 16px; border-radius: var(--radius); cursor:pointer; font-size:14px;
  }
  .url-form button:hover{ filter:brightness(1.06); }
  .url-error{ color: var(--danger); font-size:12.5px; margin:0; }
  .url-error[hidden]{ display:none; }

  .panel-notes{ flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; padding:22px 26px; }
  .notes-label{
    font-family: var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color: var(--muted); margin-bottom:12px; flex:0 0 auto;
  }
  .notes-area{
    flex:1; min-height:0; width:100%; outline:none; overflow-y:auto; cursor:text;
    color: var(--fg); font-family: var(--font-body); font-size:15px; line-height:28px;
    background-image: repeating-linear-gradient(to bottom, transparent, transparent 27px, var(--line) 28px);
    background-attachment: local;
  }
  .notes-area, .notes-area p, .notes-area div, .notes-area li{ line-height:28px; margin:0; }
  .home, .notes-area, .detail-body{ scrollbar-width: thin; scrollbar-color: transparent transparent; }
  .home:hover, .notes-area:hover, .detail-body:hover{ scrollbar-color: rgba(236,231,221,.16) transparent; }
  .home::-webkit-scrollbar, .notes-area::-webkit-scrollbar, .detail-body::-webkit-scrollbar{ width:8px; }
  .home::-webkit-scrollbar-track, .notes-area::-webkit-scrollbar-track, .detail-body::-webkit-scrollbar-track{ background:transparent; }
  .home::-webkit-scrollbar-thumb, .notes-area::-webkit-scrollbar-thumb, .detail-body::-webkit-scrollbar-thumb{ background:transparent; border-radius:4px; }
  .home:hover::-webkit-scrollbar-thumb, .notes-area:hover::-webkit-scrollbar-thumb, .detail-body:hover::-webkit-scrollbar-thumb{ background:rgba(236,231,221,.16); }
  .home::-webkit-scrollbar-thumb:hover, .notes-area::-webkit-scrollbar-thumb:hover, .detail-body::-webkit-scrollbar-thumb:hover{ background:rgba(236,231,221,.3); }
  .notes-area ul, .notes-area ol{ margin:0; padding-left:26px; }
  .notes-area code{
    background: var(--bg-raised); padding:1px 5px; border-radius:3px;
    font-family: var(--font-mono); font-size:13.5px;
  }
  .notes-area a{ color: var(--accent); }
  .notes-area.is-empty::before{ content: attr(data-placeholder); color: var(--muted); pointer-events:none; }

  /* ---- Selection toolbar ---- */
  .sel-toolbar{
    position: fixed; display:none; align-items:center; gap:2px;
    background: var(--bg-raised); border:1px solid var(--line); border-radius:7px;
    padding:4px; box-shadow: 0 10px 28px rgba(0,0,0,.55); z-index:60;
  }
  .tb-btn{
    background:none; border:none; color: var(--fg); padding:7px 10px; border-radius:4px;
    cursor:pointer; font-size:13px; line-height:1; min-width:30px;
  }
  .tb-btn:hover{ background: var(--line); }
  .tb-btn.active{ color: var(--accent); background: var(--accent-dim); }
  .tb-sep{ width:1px; align-self:stretch; background: var(--line); margin:4px 3px; }
  .tb-hl-wrap{ position:relative; }
  .hl-pop{
    position:absolute; top:100%; left:50%; transform:translateX(-50%); margin-top:6px;
    background: var(--bg-raised); border:1px solid var(--line); border-radius:7px;
    padding:7px; display:flex; gap:7px; box-shadow: 0 10px 28px rgba(0,0,0,.55);
  }
  .hl-pop[hidden]{ display:none; }
  .hl-swatch{
    width:18px; height:18px; border-radius:50%; cursor:pointer; border:1px solid rgba(0,0,0,.25);
  }
  .hl-swatch.hl-none{
    background: var(--bg); color: var(--muted); display:flex; align-items:center; justify-content:center;
    font-size:11px; border-color: var(--line);
  }

  @media (max-width: 760px){
    .home{ padding: 28px 20px 48px; }
    .detail-body{ flex-direction:column; overflow-y:auto; }
    .panel-video{
      flex:0 0 auto !important; border-bottom:1px solid var(--line); padding:18px; width:100%;
    }
    .resizer{ display:none; }
    .panel-notes{ flex:0 0 auto; min-height:50vh; padding:20px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  "use strict";
  var STORAGE_KEY = "apuntesVideo.v1";
  var SPLIT_KEY = "apuntesVideo.splitRatio";
  var app = document.getElementById("app");

  function loadData(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return { notebooks: [] };
      var parsed = JSON.parse(raw);
      if(!parsed || !Array.isArray(parsed.notebooks)) return { notebooks: [] };
      return parsed;
    }catch(e){ return { notebooks: [] }; }
  }
  function saveData(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
  }
  function loadRatio(){
    try{
      var v = parseFloat(localStorage.getItem(SPLIT_KEY));
      if(!isNaN(v) && v >= 0.2 && v <= 0.85) return v;
    }catch(e){}
    return 0.56;
  }
  function saveRatio(r){
    try{ localStorage.setItem(SPLIT_KEY, String(r)); }catch(e){}
  }

  var data = loadData();
  var splitRatio = loadRatio();
  var view = { screen: "home" };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function escapeHtml(s){
    var d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }
  function stripHtml(html){
    var d = document.createElement("div");
    d.innerHTML = html || "";
    return d.textContent || "";
  }
  function notesToHtml(raw){
    if(raw == null || raw === "") return "";
    if(/<[a-z][\s\S]*>/i.test(raw)) return raw;
    return escapeHtml(raw).replace(/\n/g, "<br>");
  }

  function extractVideoId(raw){
    if(!raw) return null;
    var str = raw.trim();
    if(/^[\w-]{11}$/.test(str)) return str;
    try{
      var u = new URL(str);
      var host = u.hostname.replace(/^www\./, "").replace(/^m\./, "");
      if(host === "youtu.be"){
        var id1 = u.pathname.slice(1).split("/")[0];
        if(/^[\w-]{11}$/.test(id1)) return id1;
      }
      if(host === "youtube.com" || host === "youtube-nocookie.com"){
        if(u.pathname === "/watch"){
          var id2 = u.searchParams.get("v");
          if(id2 && /^[\w-]{11}$/.test(id2)) return id2;
        }
        var m = u.pathname.match(/\/(embed|shorts|live)\/([\w-]{11})/);
        if(m) return m[2];
      }
    }catch(e){ /* not a valid URL */ }
    return null;
  }

  function debounce(fn, ms){
    var t;
    return function(){
      var args = arguments;
      clearTimeout(t);
      t = setTimeout(function(){ fn.apply(null, args); }, ms);
    };
  }

  function touch(nb){
    nb.updatedAt = Date.now();
    saveData();
    flashSaved();
  }
  function flashSaved(){
    var el = document.getElementById("saveIndicator");
    if(!el) return;
    el.textContent = "Guardado";
    el.classList.add("show");
    clearTimeout(flashSaved._t);
    flashSaved._t = setTimeout(function(){ el.classList.remove("show"); }, 900);
  }

  function renderApp(){
    cleanupPlayer();
    if(view.screen === "detail"){ renderDetail(view.id); }
    else { renderHome(); }
  }

  function cardHTML(nb){
    var thumb = nb.videoId ? "https://i.ytimg.com/vi/" + nb.videoId + "/hqdefault.jpg" : "";
    var title = escapeHtml(nb.title || "Sin título");
    var plain = stripHtml(nb.notes).replace(/\s+/g, " ").trim();
    var preview = plain ? escapeHtml(plain.slice(0,70)) : "Sin apuntes todavía";
    return (
      '<article class="card" id="card-' + nb.id + '">' +
        '<div class="card-thumb">' +
          (thumb ? '<img src="' + thumb + '" alt="" loading="lazy" onerror="this.remove()">' : '') +
          (!nb.videoId ? '<div class="card-thumb-empty">Sin video</div>' : '') +
          '<button class="card-del" aria-label="Eliminar" title="Eliminar">&times;</button>' +
        '</div>' +
        '<h2 class="card-title">' + title + '</h2>' +
        '<p class="card-meta">' + preview + '</p>' +
      '</article>'
    );
  }

  function emptyHTML(){
    return (
      '<div class="empty">' +
        '<p>Todavía no agregaste ningún video. Creá una carpeta y pegá el link de YouTube que querés mirar y anotar.</p>' +
        '<button class="btn-add" id="btnAddEmpty">+ Nueva carpeta</button>' +
      '</div>'
    );
  }

  function renderHome(){
    var list = data.notebooks.slice().sort(function(a,b){ return b.updatedAt - a.updatedAt; });
    app.innerHTML =
      '<div class="home">' +
        '<header class="home-header">' +
          '<div class="brand">' +
            '<h1>Apuntes de Video</h1>' +
            '<p class="count">' + list.length + (list.length === 1 ? ' carpeta' : ' carpetas') + '</p>' +
          '</div>' +
          '<div class="header-actions">' +
            '<button class="btn-ghost" id="btnExport">Exportar copia</button>' +
            '<button class="btn-ghost" id="btnImport">Importar copia</button>' +
            '<input type="file" id="importFile" accept="application/json" hidden>' +
            '<button class="btn-add" id="btnAdd">+ Nueva carpeta</button>' +
          '</div>' +
        '</header>' +
        (list.length === 0
          ? emptyHTML()
          : '<div class="grid">' + list.map(cardHTML).join('') + '</div>') +
      '</div>';

    var btnAdd = document.getElementById("btnAdd");
    if(btnAdd) btnAdd.addEventListener("click", addNotebook);
    var btnAddEmpty = document.getElementById("btnAddEmpty");
    if(btnAddEmpty) btnAddEmpty.addEventListener("click", addNotebook);

    var btnExport = document.getElementById("btnExport");
    if(btnExport) btnExport.addEventListener("click", exportBackup);
    var btnImport = document.getElementById("btnImport");
    var importFile = document.getElementById("importFile");
    if(btnImport && importFile){
      btnImport.addEventListener("click", function(){ importFile.click(); });
      importFile.addEventListener("change", function(){
        if(importFile.files && importFile.files[0]) handleImportFile(importFile.files[0]);
      });
    }

    list.forEach(function(nb){
      var card = document.getElementById("card-" + nb.id);
      if(!card) return;
      card.addEventListener("click", function(e){
        if(e.target.closest(".card-del")) return;
        openNotebook(nb.id);
      });
      var del = card.querySelector(".card-del");
      del.addEventListener("click", function(e){
        e.stopPropagation();
        deleteNotebook(nb.id);
      });
    });
  }

  function exportBackup(){
    try{
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      var stamp = new Date().toISOString().slice(0,10);
      a.href = url;
      a.download = "apuntes-video-backup-" + stamp + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    }catch(e){
      alert("No se pudo exportar la copia.");
    }
  }

  function handleImportFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{ parsed = JSON.parse(reader.result); }
      catch(e){ alert("Ese archivo no es una copia válida."); return; }
      if(!parsed || !Array.isArray(parsed.notebooks)){
        alert("Ese archivo no es una copia válida.");
        return;
      }
      var ok = confirm(
        "Vas a importar " + parsed.notebooks.length + " carpeta(s). " +
        "Esto reemplaza todo lo que tenés guardado acá ahora mismo. ¿Continuar?"
      );
      if(!ok) return;
      data = parsed;
      saveData();
      view = { screen: "home" };
      renderApp();
    };
    reader.readAsText(file);
  }

  function addNotebook(){
    var nb = { id: uid(), title: "", url: "", videoId: "", notes: "", lastTime: 0, createdAt: Date.now(), updatedAt: Date.now() };
    data.notebooks.push(nb);
    saveData();
    openNotebook(nb.id);
  }

  function deleteNotebook(id){
    if(!confirm("¿Eliminar esta carpeta y sus apuntes? No se puede deshacer.")) return;
    data.notebooks = data.notebooks.filter(function(n){ return n.id !== id; });
    saveData();
    if(view.screen === "detail" && view.id === id){ view = { screen: "home" }; }
    renderApp();
  }

  function openNotebook(id){
    view = { screen: "detail", id: id };
    renderApp();
  }

  function urlFormHTML(existing){
    return (
      '<form id="urlForm" class="url-form">' +
        '<label for="urlInput">Pegá el link del video de YouTube</label>' +
        '<input id="urlInput" type="text" inputmode="url" placeholder="https://www.youtube.com/watch?v=…" value="' + escapeHtml(existing || "") + '">' +
        '<button type="submit">Cargar video</button>' +
        '<p class="url-error" id="urlError" hidden>No pude reconocer ese link. Copialo de nuevo desde YouTube e intentá otra vez.</p>' +
      '</form>'
    );
  }

  /* ---------- Rich text selection toolbar (built once, lives outside #app) ---------- */

  function buildToolbar(){
    var el = document.createElement("div");
    el.className = "sel-toolbar";
    el.id = "selToolbar";
    el.innerHTML =
      '<button class="tb-btn" data-cmd="bold" title="Negrita"><b>B</b></button>' +
      '<button class="tb-btn" data-cmd="italic" title="Cursiva"><i>I</i></button>' +
      '<button class="tb-btn" data-cmd="underline" title="Subrayado"><u>U</u></button>' +
      '<button class="tb-btn" data-cmd="strikeThrough" title="Tachado"><s>S</s></button>' +
      '<span class="tb-sep"></span>' +
      '<button class="tb-btn" data-action="code" title="Código">&lt;/&gt;</button>' +
      '<span class="tb-hl-wrap">' +
        '<button class="tb-btn" data-action="hl-toggle" title="Resaltar">Resaltar</button>' +
        '<div class="hl-pop" id="hlPop" hidden>' +
          '<span class="hl-swatch" data-color="rgba(244,207,102,.3)" style="background:#f4cf66" title="Amarillo"></span>' +
          '<span class="hl-swatch" data-color="rgba(143,209,158,.28)" style="background:#8fd19e" title="Verde"></span>' +
          '<span class="hl-swatch" data-color="rgba(142,201,224,.28)" style="background:#8ec9e0" title="Celeste"></span>' +
          '<span class="hl-swatch" data-color="rgba(227,154,196,.28)" style="background:#e39ac4" title="Rosa"></span>' +
          '<span class="hl-swatch hl-none" data-color="transparent" title="Quitar">&times;</span>' +
        '</div>' +
      '</span>' +
      '<span class="tb-sep"></span>' +
      '<button class="tb-btn" data-cmd="insertUnorderedList" title="Lista de puntos">&bull;</button>' +
      '<button class="tb-btn" data-cmd="insertOrderedList" title="Lista numerada">1.</button>' +
      '<span class="tb-sep"></span>' +
      '<button class="tb-btn" data-action="link" title="Link">Link</button>' +
      '<button class="tb-btn" data-cmd="removeFormat" title="Quitar formato">&oslash;</button>';
    document.body.appendChild(el);
    return el;
  }

  function getCurrentNb(){
    if(view.screen !== "detail") return null;
    return data.notebooks.find(function(n){ return n.id === view.id; }) || null;
  }

  function syncNotesFromDom(){
    var nb = getCurrentNb();
    var na = document.getElementById("notesArea");
    if(nb && na){
      nb.notes = na.innerHTML;
      touch(nb);
    }
  }

  function hideHlPop(){
    var pop = document.getElementById("hlPop");
    if(pop) pop.hidden = true;
  }
  function toggleHlPop(){
    var pop = document.getElementById("hlPop");
    if(pop) pop.hidden = !pop.hidden;
  }

  function applyHighlight(color){
    try{ document.execCommand("hiliteColor", false, color); }
    catch(e){ try{ document.execCommand("backColor", false, color); }catch(e2){} }
  }

  function wrapSelectionWithTag(tag){
    var sel = window.getSelection();
    if(!sel || sel.rangeCount === 0) return;
    var range = sel.getRangeAt(0);
    if(range.collapsed) return;
    var wrapper = document.createElement(tag);
    try{
      range.surroundContents(wrapper);
    }catch(e){
      var frag = range.extractContents();
      wrapper.appendChild(frag);
      range.insertNode(wrapper);
    }
    sel.removeAllRanges();
    var newRange = document.createRange();
    newRange.selectNodeContents(wrapper);
    sel.addRange(newRange);
  }

  function updateToolbarState(){
    var toolbarEl = document.getElementById("selToolbar");
    if(!toolbarEl) return;
    ["bold","italic","underline","strikeThrough","insertUnorderedList","insertOrderedList"].forEach(function(cmd){
      var btn = toolbarEl.querySelector('[data-cmd="' + cmd + '"]');
      if(!btn) return;
      var active = false;
      try{ active = document.queryCommandState(cmd); }catch(e){}
      btn.classList.toggle("active", active);
    });
  }

  function positionToolbar(rect, toolbarEl){
    var tw = toolbarEl.offsetWidth;
    var th = toolbarEl.offsetHeight;
    var left = rect.left + rect.width / 2 - tw / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
    var top = rect.top - th - 10;
    if(top < 8){ top = rect.bottom + 10; }
    toolbarEl.style.left = left + "px";
    toolbarEl.style.top = top + "px";
  }

  function handleSelectionChange(){
    var toolbarEl = document.getElementById("selToolbar");
    var notesArea = document.getElementById("notesArea");
    if(!toolbarEl || !notesArea){ return; }
    var sel = window.getSelection();
    if(!sel || sel.rangeCount === 0 || sel.isCollapsed){
      toolbarEl.style.display = "none";
      hideHlPop();
      return;
    }
    var range = sel.getRangeAt(0);
    if(!notesArea.contains(range.commonAncestorContainer)){
      toolbarEl.style.display = "none";
      hideHlPop();
      return;
    }
    var rect = range.getBoundingClientRect();
    if(rect.width === 0 && rect.height === 0){
      toolbarEl.style.display = "none";
      return;
    }
    toolbarEl.style.display = "flex";
    updateToolbarState();
    positionToolbar(rect, toolbarEl);
  }

  function wireToolbar(toolbarEl){
    toolbarEl.addEventListener("mousedown", function(e){
      var swatch = e.target.closest(".hl-swatch");
      var btn = e.target.closest(".tb-btn");
      if(!swatch && !btn) return;
      e.preventDefault();

      if(swatch){
        applyHighlight(swatch.getAttribute("data-color"));
        hideHlPop();
        syncNotesFromDom();
        updateToolbarState();
        return;
      }

      var action = btn.getAttribute("data-action");
      var cmd = btn.getAttribute("data-cmd");

      if(action === "hl-toggle"){ toggleHlPop(); return; }

      if(action === "code"){
        wrapSelectionWithTag("code");
        syncNotesFromDom();
        updateToolbarState();
        return;
      }

      if(action === "link"){
        var url = window.prompt("Pegá el link:");
        if(url){
          document.execCommand("createLink", false, url);
          var na = document.getElementById("notesArea");
          if(na){
            na.querySelectorAll("a:not([target])").forEach(function(a){
              a.setAttribute("target", "_blank");
              a.setAttribute("rel", "noopener");
            });
          }
        }
        syncNotesFromDom();
        updateToolbarState();
        return;
      }

      if(cmd){
        document.execCommand(cmd, false, null);
        syncNotesFromDom();
        updateToolbarState();
      }
    });
  }

  var toolbarEl = buildToolbar();
  wireToolbar(toolbarEl);
  document.addEventListener("selectionchange", handleSelectionChange);
  document.addEventListener("mousedown", function(e){
    var hlWrap = toolbarEl.querySelector(".tb-hl-wrap");
    if(hlWrap && !hlWrap.contains(e.target)) hideHlPop();
  });

  /* ---------- Fullscreen ---------- */

  function toggleFullscreen(){
    if(!document.fullscreenElement){
      var el = document.documentElement;
      if(el.requestFullscreen) el.requestFullscreen().catch(function(){});
    } else if(document.exitFullscreen){
      document.exitFullscreen().catch(function(){});
    }
  }
  document.addEventListener("fullscreenchange", function(){
    var btn = document.getElementById("btnFs");
    if(btn) btn.textContent = document.fullscreenElement ? "Salir de pantalla completa" : "Pantalla completa";
  });

  /* ---------- Resizer ---------- */

  function startResize(startClientX){
    var detailBody = document.querySelector(".detail-body");
    var panelVideo = document.getElementById("panelVideo");
    var resizerEl = document.getElementById("resizer");
    if(!detailBody || !panelVideo) return;
    var rect = detailBody.getBoundingClientRect();
    document.body.classList.add("resizing");
    if(resizerEl) resizerEl.classList.add("active");

    function applyAt(clientX){
      var ratio = (clientX - rect.left) / rect.width;
      ratio = Math.max(0.22, Math.min(0.82, ratio));
      panelVideo.style.flex = "0 0 " + (ratio * 100).toFixed(2) + "%";
      splitRatio = ratio;
    }
    function onMouseMove(e){ applyAt(e.clientX); }
    function onTouchMove(e){ if(e.touches && e.touches[0]) applyAt(e.touches[0].clientX); }
    function stop(){
      document.body.classList.remove("resizing");
      if(resizerEl) resizerEl.classList.remove("active");
      document.removeEventListener("mousemove", onMouseMove);
      document.removeEventListener("mouseup", stop);
      document.removeEventListener("touchmove", onTouchMove);
      document.removeEventListener("touchend", stop);
      saveRatio(splitRatio);
    }
    document.addEventListener("mousemove", onMouseMove);
    document.addEventListener("mouseup", stop);
    document.addEventListener("touchmove", onTouchMove, { passive: true });
    document.addEventListener("touchend", stop);
  }

  /* ---------- YouTube player + resume progress ---------- */

  var currentPlayer = null;
  var currentPlayerNb = null;
  var progressInterval = null;
  var ytScriptAdded = false;
  var pendingPlayerSetups = [];

  function ensureYouTubeApi(cb){
    if(window.YT && window.YT.Player){ cb(); return; }
    pendingPlayerSetups.push(cb);
    if(!ytScriptAdded){
      ytScriptAdded = true;
      var s = document.createElement("script");
      s.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(s);
    }
  }
  window.onYouTubeIframeAPIReady = function(){
    var queued = pendingPlayerSetups.slice();
    pendingPlayerSetups.length = 0;
    queued.forEach(function(fn){ fn(); });
  };

  function stopProgressTracking(){
    if(progressInterval){ clearInterval(progressInterval); progressInterval = null; }
  }

  function saveProgress(){
    if(!currentPlayer || !currentPlayerNb || typeof currentPlayer.getCurrentTime !== "function") return;
    try{
      var t = currentPlayer.getCurrentTime();
      if(typeof t === "number" && !isNaN(t) && t > 0){
        currentPlayerNb.lastTime = t;
        saveData();
      }
    }catch(e){}
  }

  function cleanupPlayer(){
    stopProgressTracking();
    saveProgress();
    if(currentPlayer){
      try{ currentPlayer.destroy(); }catch(e){}
    }
    currentPlayer = null;
    currentPlayerNb = null;
  }

  function setupPlayer(nb){
    currentPlayerNb = nb;
    ensureYouTubeApi(function(){
      if(view.screen !== "detail" || view.id !== nb.id) return;
      var container = document.getElementById("ytPlayer");
      if(!container) return;
      currentPlayer = new YT.Player("ytPlayer", {
        width: "100%",
        height: "100%",
        videoId: nb.videoId,
        playerVars: {
          rel: 0,
          modestbranding: 1,
          iv_load_policy: 3,
          playsinline: 1,
          start: Math.max(0, Math.floor(nb.lastTime || 0))
        },
        events: {
          onReady: function(){
            stopProgressTracking();
            progressInterval = setInterval(saveProgress, 4000);
          },
          onStateChange: function(e){
            if(window.YT && (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED)){
              saveProgress();
            }
          }
        }
      });
    });
  }

  window.addEventListener("beforeunload", function(){ saveProgress(); });
  document.addEventListener("visibilitychange", function(){ if(document.hidden) saveProgress(); });

  /* ---------- Detail view ---------- */

  function renderDetail(id){
    var nb = data.notebooks.find(function(n){ return n.id === id; });
    if(!nb){ view = { screen: "home" }; renderApp(); return; }

    app.innerHTML =
      '<div class="detail">' +
        '<header class="detail-header">' +
          '<button class="btn-back" id="btnBack" aria-label="Volver">&larr;</button>' +
          '<input class="title-input" id="titleInput" placeholder="Título de la carpeta" value="' + escapeHtml(nb.title) + '">' +
          '<span class="save-indicator" id="saveIndicator"></span>' +
          '<button class="btn-fs" id="btnFs">Pantalla completa</button>' +
          '<button class="btn-del" id="btnDel">Eliminar</button>' +
        '</header>' +
        '<div class="detail-body">' +
          '<section class="panel-video" id="panelVideo" style="flex:0 0 ' + (splitRatio * 100).toFixed(2) + '%;">' +
            (nb.videoId ? '<div class="video-wrap"><div id="ytPlayer"></div></div>' : urlFormHTML(nb.url)) +
          '</section>' +
          '<div class="resizer" id="resizer" role="separator" aria-orientation="vertical" title="Arrastrá para ajustar"></div>' +
          '<section class="panel-notes">' +
            '<div class="notes-label">Apuntes</div>' +
            '<div id="notesArea" class="notes-area" contenteditable="true" data-placeholder="Escribí tus apuntes acá…"></div>' +
          '</section>' +
        '</div>' +
      '</div>';

    document.getElementById("btnBack").addEventListener("click", function(){
      view = { screen: "home" };
      renderApp();
    });
    document.getElementById("btnDel").addEventListener("click", function(){ deleteNotebook(id); });
    document.getElementById("btnFs").addEventListener("click", toggleFullscreen);
    if(document.fullscreenElement){
      document.getElementById("btnFs").textContent = "Salir de pantalla completa";
    }

    var titleInput = document.getElementById("titleInput");
    titleInput.addEventListener("input", debounce(function(){
      nb.title = titleInput.value;
      touch(nb);
    }, 300));

    var notesArea = document.getElementById("notesArea");
    notesArea.innerHTML = notesToHtml(nb.notes);
    updateEmptyState(notesArea);
    notesArea.addEventListener("input", function(){
      updateEmptyState(notesArea);
      debouncedNotesSave();
    });
    var debouncedNotesSave = debounce(function(){
      nb.notes = notesArea.innerHTML;
      touch(nb);
    }, 300);

    var resizer = document.getElementById("resizer");
    if(resizer){
      resizer.addEventListener("mousedown", function(e){
        e.preventDefault();
        startResize(e.clientX);
      });
      resizer.addEventListener("touchstart", function(e){
        if(e.touches && e.touches[0]) startResize(e.touches[0].clientX);
      }, { passive: true });
    }

    if(nb.videoId){
      setupPlayer(nb);
    }

    if(!nb.videoId){
      var form = document.getElementById("urlForm");
      form.addEventListener("submit", function(e){
        e.preventDefault();
        var input = document.getElementById("urlInput");
        var vid = extractVideoId(input.value);
        if(!vid){
          document.getElementById("urlError").hidden = false;
          return;
        }
        nb.url = input.value.trim();
        nb.videoId = vid;
        if(!nb.title) nb.title = "Video " + vid;
        touch(nb);
        renderDetail(id);
      });
    }
  }

  function updateEmptyState(el){
    var empty = el.textContent.trim() === "";
    el.classList.toggle("is-empty", empty);
  }

  renderApp();
})();
</script>
